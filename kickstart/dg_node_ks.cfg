# Kickstart for Data Guard node prm1 (Oracle Linux 9 boot ISO, network install from yum.oracle.com).
# stb1 is a linked clone of prm1 and is re-addressed by guest/dataguard/stb1_reconfig_root.sh.
# @@LAB_SSH_PUBKEY@@ is filled in by host/02-build-dataguard.ps1.
text
url --url=https://yum.oracle.com/repo/OracleLinux/OL9/baseos/latest/x86_64/
repo --name=appstream --baseurl=https://yum.oracle.com/repo/OracleLinux/OL9/appstream/x86_64/
lang en_US.UTF-8
keyboard us
timezone Asia/Ho_Chi_Minh --utc
rootpw --iscrypted @@VBOX_INSERT_ROOT_PASSWORD_SHACRYPT512@@
network --bootproto=static --device=link --ip=192.168.100.11 --netmask=255.255.255.0 --gateway=192.168.100.1 --nameserver=192.168.100.1 --hostname=prm1.localdomain --activate --onboot=on
firewall --disabled
selinux --permissive
firstboot --disable
skipx

bootloader --location=mbr --append="nomodeset"
zerombr
clearpart --all --initlabel
part /boot --fstype=xfs --size=1024
part pv.01 --size=1 --grow
volgroup vg_sys pv.01
logvol /     --vgname=vg_sys --name=lv_root --fstype=xfs --size=20480
logvol swap  --vgname=vg_sys --name=lv_swap --size=4096
logvol /u01  --vgname=vg_sys --name=lv_u01  --fstype=xfs --size=1 --grow

reboot --eject

%packages --ignoremissing
@core
@base
bc
binutils
compat-openssl11
elfutils-libelf-devel
glibc-devel
gcc
make
ksh
libaio
libaio-devel
libnsl
libnsl2
libxcrypt-compat
net-tools
sysstat
unzip
zip
tar
chrony
%end

%post --log=/root/ks-post.log
mkdir -p /root/.ssh
chmod 700 /root/.ssh
echo "@@LAB_SSH_PUBKEY@@" > /root/.ssh/authorized_keys
chmod 600 /root/.ssh/authorized_keys
restorecon -R /root/.ssh || true
sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin prohibit-password/' /etc/ssh/sshd_config
cat >> /etc/hosts <<'EOF'
192.168.100.10  oem24.localdomain oem24
192.168.100.11  prm1.localdomain  prm1
192.168.100.12  stb1.localdomain  stb1
EOF
systemctl enable chronyd
%end
